name: Verify development setup

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-setup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Deliberately do not cache .tools: verify the fresh-install path.
      - name: Install pinned SDK, restore, build and test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1 -SkipExtensions
      - name: Verify setup can be repeated
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1 -SkipExtensions
